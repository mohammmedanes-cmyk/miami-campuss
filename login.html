{% extends "base.html" %}

{% block title %}Sign In - Philadelphia Campus{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-10">
    <div class="text-center mb-8">
        <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-slate-900 border-2 border-red-500 p-1 shadow-lg shadow-red-600/20 overflow-hidden flex items-center justify-center">
            <img src="{{ url_for('static', filename='images/logo_icon_192.png') }}" class="w-full h-full object-cover rounded-xl">
        </div>
        <div class="inline-block px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-widest bg-blue-100 text-blue-900 border border-blue-300 mb-2">
            American Collegiate Gateway
        </div>
        <h1 class="text-3xl font-black text-slate-900 tracking-tight">Philadelphia Campus</h1>
        <p class="text-slate-500 mt-2 text-sm">Access your private university discussions</p>
    </div>

    <div class="bg-white rounded-3xl shadow-xl border-t-8 border-t-blue-800 border-x border-b border-slate-200 p-8 sm:p-9">
        <form action="{{ url_for('login', next=request.args.get('next', '')) }}" method="POST" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-bold text-slate-800 mb-1.5">
                    <i class="fa-solid fa-envelope text-blue-700 mr-1.5"></i>Email Address (البريد الإلكتروني)
                </label>
                <input type="email" id="email" name="email" required placeholder="yourname@gmail.com or student.edu"
                       class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600/30 focus:border-blue-700 text-sm transition-all"
                       value="{{ request.form.get('email', '') }}">
            </div>

            <div>
                <label for="password" class="block text-sm font-bold text-slate-800 mb-1.5">
                    <i class="fa-solid fa-lock text-blue-700 mr-1.5"></i>Password
                </label>
                <input type="password" id="password" name="password" required placeholder="Enter your password"
                       class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600/30 focus:border-blue-700 text-sm transition-all">
            </div>

            <button type="submit" class="w-full py-3.5 px-4 bg-blue-700 hover:bg-blue-800 text-white font-bold uppercase tracking-wider rounded-xl shadow-lg shadow-blue-700/30 transition-all text-sm flex items-center justify-center space-x-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Sign In to Philadelphia Campus</span>
            </button>

            <div class="text-center pt-2">
                <p class="text-sm text-slate-600">
                    Need a campus account? 
                    <a href="{{ url_for('register') }}" class="font-bold text-red-600 hover:text-red-700">Register here</a>
                </p>
            </div>
        </form>

        <!-- Quick Demo Accounts -->
        <div class="mt-8 pt-6 border-t border-slate-100">
            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2.5 text-center">Demo Student Accounts (Click to autofill)</p>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button type="button" onclick="fillDemo('sarah.m@student.philadelphia.edu', 'password123')"
                        class="p-2 bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-xl text-left transition-colors">
                    <div class="font-bold text-slate-800">Sarah M. 🇩🇿</div>
                    <div class="text-[11px] text-blue-700">CS & IT</div>
                </button>
                <button type="button" onclick="fillDemo('lucas.d@student.philadelphia.edu', 'password123')"
                        class="p-2 bg-slate-50 hover:bg-red-50 border border-slate-200 hover:border-red-300 rounded-xl text-left transition-colors">
                    <div class="font-bold text-slate-800">Lucas D. 🇫🇷</div>
                    <div class="text-[11px] text-red-700">Medicine</div>
                </button>
                <button type="button" onclick="fillDemo('marcus.v@student.philadelphia.edu', 'password123')"
                        class="p-2 bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-xl text-left transition-colors">
                    <div class="font-bold text-slate-800">Marcus V. 🇺🇸</div>
                    <div class="text-[11px] text-blue-700">Engineering</div>
                </button>
                <button type="button" onclick="fillDemo('amina.e@student.philadelphia.edu', 'password123')"
                        class="p-2 bg-slate-50 hover:bg-red-50 border border-slate-200 hover:border-red-300 rounded-xl text-left transition-colors">
                    <div class="font-bold text-slate-800">Amina E. 🇪🇬</div>
                    <div class="text-[11px] text-red-700">Business</div>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function fillDemo(email, pwd) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pwd;
}
</script>
{% endblock %}
