databases:
  - name: philadelphia-db
    plan: free
    databaseName: philadelphia_campus
    user: campus_user

services:
  - type: web
    name: miami-campus
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: philadelphia-db
          property: connectionString
